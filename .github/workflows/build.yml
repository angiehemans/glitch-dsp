name: build

on:
  push:
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: cmake --preset release
      - run: cmake --build --preset release -j4
      - run: test -f build/release/engine/Glitch_artefacts/Release/ui/index.html

  macos:
    runs-on: macos-14
    permissions:
      contents: write # to publish releases on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runners are Apple Silicon; the show Mac is Intel, so build universal.
      - run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - run: cmake --build --preset release -j4
      - run: test -f build/release/engine/Glitch_artefacts/Release/Glitch.app/Contents/Resources/ui/index.html
      # A disk image keeps the app's permissions (upload-artifact drops them) and opens to the
      # usual drag-to-Applications window.
      - name: Make Glitch.dmg
        run: |
          mkdir dmg
          cp -R build/release/engine/Glitch_artefacts/Release/Glitch.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Glitch -srcfolder dmg -ov -format UDZO Glitch.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Glitch-macOS
          path: Glitch.dmg
          compression-level: 0 # already compressed
      # Tags (v*) publish the dmg as a GitHub Release; pre-release while the app is unsigned.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Glitch.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" Glitch.dmg --prerelease --title "Glitch $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
